name: opencode

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: opencode-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  explain:
    name: Explain with OpenCode
    if: >-
      ${{
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
        !contains(github.event.comment.body, '/oc fix') &&
        !contains(github.event.comment.body, '/opencode fix')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # post the answer in the issue or pull request thread
      pull-requests: read # read pull request context for comments on a pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install OpenCode 1.19.6
        env:
          OPENCODE_VERSION: "1.19.6"
          OPENCODE_SHA256: "47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057"
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
          fi
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          install_dir="$HOME/.opencode/bin"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" opencode
          chmod +x "$install_dir/opencode"
          echo "$install_dir" >> "$GITHUB_PATH"
          installed="$("$install_dir/opencode" --version)"
          if [ "$installed" != "$OPENCODE_VERSION" ]; then
            echo "Expected OpenCode $OPENCODE_VERSION, got $installed" >&2
            exit 1
          fi

      - name: Run OpenCode
        env:
          MODEL: deepseek/deepseek-flash
          USE_GITHUB_TOKEN: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: opencode github run

  fix:
    name: Fix with OpenCode
    if: >-
      ${{
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '/oc fix') || contains(github.event.comment.body, '/opencode fix'))
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push the agent branch
      issues: write # post progress and the answer
      pull-requests: write # open the pull request
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install OpenCode 1.19.6
        env:
          OPENCODE_VERSION: "1.19.6"
          OPENCODE_SHA256: "47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057"
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "x86_64" ]; then
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
          fi
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          url="https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --retry-delay 2 -fsSL "$url" -o "$archive"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum -c -
          install_dir="$HOME/.opencode/bin"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" opencode
          chmod +x "$install_dir/opencode"
          echo "$install_dir" >> "$GITHUB_PATH"
          installed="$("$install_dir/opencode" --version)"
          if [ "$installed" != "$OPENCODE_VERSION" ]; then
            echo "Expected OpenCode $OPENCODE_VERSION, got $installed" >&2
            exit 1
          fi

      - name: Run OpenCode
        env:
          MODEL: deepseek/deepseek-flash
          USE_GITHUB_TOKEN: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: opencode github run
